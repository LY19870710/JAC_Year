<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAC Year Manager - Journal of Advanced Ceramics</title>
<style>
:root {
  --primary: #1a5276;
  --primary-light: #2980b9;
  --accent: #e74c3c;
  --bg: #f5f6fa;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-light: #7f8c8d;
  --border: #dcdde1;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  padding: 24px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.header p {
  font-size: 0.85rem;
  opacity: 0.85;
}

/* Search bar */
.search-section {
  max-width: 1200px;
  margin: 20px auto 12px;
  padding: 0 20px;
}

.search-bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.search-input-wrap {
  flex: 1;
  min-width: 240px;
  position: relative;
}

.search-input-wrap input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.95rem;
  background: var(--card-bg);
  transition: border-color 0.2s;
}

.search-input-wrap input:focus {
  outline: none;
  border-color: var(--primary-light);
}

.search-input-wrap::before {
  content: "🔍";
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
}

.filter-select {
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.9rem;
  background: var(--card-bg);
  cursor: pointer;
  min-width: 120px;
}

.filter-select:focus {
  outline: none;
  border-color: var(--primary-light);
}

/* Stats bar */
.stats-bar {
  max-width: 1200px;
  margin: 0 auto 16px;
  padding: 0 20px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.stat-badge {
  background: var(--card-bg);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.82rem;
  color: var(--text-light);
  border: 1px solid var(--border);
}

.stat-badge strong {
  color: var(--primary);
}

/* Article list */
.article-list {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px 40px;
}

.article-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border-left: 4px solid transparent;
  transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  cursor: pointer;
}

.article-card:hover {
  border-left-color: var(--primary-light);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}

.article-card.expanded {
  border-left-color: var(--accent);
}

.article-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.article-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--primary);
  flex: 1;
  line-height: 1.4;
}

.article-title a {
  color: inherit;
  text-decoration: none;
}

.article-title a:hover {
  text-decoration: underline;
}

.article-meta {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  align-items: center;
}

.article-year {
  background: var(--primary);
  color: white;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.78rem;
  font-weight: 600;
}

.article-type {
  background: #eaf2f8;
  color: var(--primary);
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.78rem;
}

.article-authors {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-top: 8px;
  line-height: 1.5;
}

.article-keywords {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.keyword-tag {
  background: #f0f3f5;
  color: var(--text-light);
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 0.75rem;
}

.article-details {
  display: none;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.article-card.expanded .article-details { display: block; }

.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}

.detail-item {
  font-size: 0.83rem;
}

.detail-item label {
  display: block;
  color: var(--text-light);
  font-size: 0.75rem;
  margin-bottom: 2px;
}

.detail-item span {
  color: var(--text);
}

.detail-abstract {
  font-size: 0.88rem;
  color: var(--text);
  line-height: 1.7;
  margin-top: 8px;
}

.detail-links {
  margin-top: 12px;
  display: flex;
  gap: 12px;
}

.detail-links a {
  font-size: 0.83rem;
  color: var(--primary-light);
  text-decoration: none;
}

.detail-links a:hover { text-decoration: underline; }

/* Loading */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
  font-size: 1rem;
}

.loading-spinner {
  display: inline-block;
  width: 32px;
  height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* No results */
.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}

.no-results-icon {
  font-size: 3rem;
  margin-bottom: 12px;
}

/* Footer */
.footer {
  text-align: center;
  padding: 20px;
  color: var(--text-light);
  font-size: 0.8rem;
  border-top: 1px solid var(--border);
  margin-top: 20px;
}

/* Responsive */
@media (max-width: 640px) {
  .header h1 { font-size: 1.2rem; }
  .search-bar { flex-direction: column; }
  .filter-select { width: 100%; }
  .article-header { flex-direction: column; }
  .article-meta { flex-shrink: 1; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1>JAC Year Manager</h1>
    <p>Journal of Advanced Ceramics — Article Index & Search</p>
  </div>
</header>

<section class="search-section">
  <div class="search-bar">
    <div class="search-input-wrap">
      <input type="text" id="searchInput" placeholder="Search by title, author, keyword...">
    </div>
    <select class="filter-select" id="yearFilter">
      <option value="">All Years</option>
    </select>
    <select class="filter-select" id="typeFilter">
      <option value="">All Types</option>
    </select>
  </div>
</section>

<div class="stats-bar" id="statsBar"></div>

<div class="article-list" id="articleList">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div>Loading articles...</div>
  </div>
</div>

<div class="footer">
  JAC Year Manager &copy; 2026 — Data from <a href="https://www.sciopen.com" style="color:var(--primary-light)">SciOpen</a>
</div>

<script>
const DATA_URL = 'articles_md/articles.json';

let allArticles = [];
let filteredArticles = [];

// DOM elements
const searchInput = document.getElementById('searchInput');
const yearFilter = document.getElementById('yearFilter');
const typeFilter = document.getElementById('typeFilter');
const articleList = document.getElementById('articleList');
const statsBar = document.getElementById('statsBar');

// Load data
async function loadData() {
  try {
    const resp = await fetch(DATA_URL);
    allArticles = await resp.json();
    filteredArticles = allArticles;
    populateFilters();
    render();
  } catch (e) {
    articleList.innerHTML = `<div class="no-results"><div class="no-results-icon">⚠️</div><div>Failed to load data: ${e.message}</div></div>`;
  }
}

// Populate filter dropdowns
function populateFilters() {
  const years = new Set();
  const types = new Set();
  allArticles.forEach(a => {
    if (a.year) years.add(a.year);
    if (a.type) types.add(a.type);
  });

  [...years].sort((a,b) => b-a).forEach(y => {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    yearFilter.appendChild(opt);
  });

  [...types].sort().forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    typeFilter.appendChild(opt);
  });
}

// Filter and search
function applyFilters() {
  const query = searchInput.value.toLowerCase().trim();
  const yearVal = yearFilter.value;
  const typeVal = typeFilter.value;

  filteredArticles = allArticles.filter(a => {
    // Year filter
    if (yearVal && a.year != yearVal) return false;
    // Type filter
    if (typeVal && a.type !== typeVal) return false;
    // Search query
    if (query) {
      const searchable = [
        a.title,
        ...(a.authors?.map(au => au.name) || []),
        ...(a.keywords || []),
        a.research_area || '',
        a.abstract || '',
      ].join(' ').toLowerCase();
      if (!searchable.includes(query)) return false;
    }
    return true;
  });

  render();
}

// Render article list
function render() {
  // Stats
  const totalViews = filteredArticles.reduce((s, a) => s + (parseInt(a.views) || 0), 0);
  const totalDownloads = filteredArticles.reduce((s, a) => s + (parseInt(a.downloads) || 0), 0);
  statsBar.innerHTML = `
    <span class="stat-badge"><strong>${filteredArticles.length}</strong> articles</span>
    <span class="stat-badge"><strong>${totalViews.toLocaleString()}</strong> views</span>
    <span class="stat-badge"><strong>${totalDownloads.toLocaleString()}</strong> downloads</span>
  `;

  if (filteredArticles.length === 0) {
    articleList.innerHTML = `<div class="no-results"><div class="no-results-icon">🔍</div><div>No articles found</div></div>`;
    return;
  }

  articleList.innerHTML = filteredArticles.map((a, i) => {
    const authorNames = (a.authors || []).map(au => au.name).join(', ');
    const shortAuthors = authorNames.length > 120 ? authorNames.substring(0, 120) + '...' : authorNames;
    const keywords = (a.keywords || []).slice(0, 5).map(k =>
      `<span class="keyword-tag">${escapeHtml(k)}</span>`
    ).join('');

    return `
    <div class="article-card" onclick="toggleExpand(this)" data-idx="${i}">
      <div class="article-header">
        <div class="article-title">
          <a href="${a.url || '#'}" target="_blank" onclick="event.stopPropagation()">${escapeHtml(a.title)}</a>
        </div>
        <div class="article-meta">
          ${a.year ? `<span class="article-year">${a.year}</span>` : ''}
          ${a.type ? `<span class="article-type">${escapeHtml(a.type)}</span>` : ''}
        </div>
      </div>
      <div class="article-authors">${escapeHtml(shortAuthors)}</div>
      ${keywords ? `<div class="article-keywords">${keywords}</div>` : ''}
      <div class="article-details">
        <div class="detail-grid">
          ${a.doi ? `<div class="detail-item"><label>DOI</label><span>${escapeHtml(a.doi)}</span></div>` : ''}
          ${a.volume ? `<div class="detail-item"><label>Volume / Issue</label><span>${a.volume}(${a.issue})</span></div>` : ''}
          ${a.research_area ? `<div class="detail-item"><label>Research Area</label><span>${escapeHtml(a.research_area)}</span></div>` : ''}
          ${a.received ? `<div class="detail-item"><label>Received</label><span>${escapeHtml(a.received)}</span></div>` : ''}
          ${a.accepted ? `<div class="detail-item"><label>Accepted</label><span>${escapeHtml(a.accepted)}</span></div>` : ''}
          ${a.published ? `<div class="detail-item"><label>Published</label><span>${escapeHtml(a.published)}</span></div>` : ''}
          ${a.views ? `<div class="detail-item"><label>Views</label><span>${a.views}</span></div>` : ''}
          ${a.downloads ? `<div class="detail-item"><label>Downloads</label><span>${a.downloads}</span></div>` : ''}
          ${a.citations ? `<div class="detail-item"><label>Citations</label><span>${a.citations}</span></div>` : ''}
        </div>
        ${a.abstract ? `<div class="detail-abstract"><strong>Abstract:</strong> ${escapeHtml(a.abstract)}</div>` : ''}
        <div class="detail-links">
          ${a.url ? `<a href="${a.url}" target="_blank">View on SciOpen →</a>` : ''}
          ${a.pdf ? `<a href="${a.pdf}" target="_blank">Download PDF →</a>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// Toggle expand
function toggleExpand(card) {
  card.classList.toggle('expanded');
}

// Escape HTML
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Event listeners
searchInput.addEventListener('input', debounce(applyFilters, 300));
yearFilter.addEventListener('change', applyFilters);
typeFilter.addEventListener('change', applyFilters);

function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

// Init
loadData();
</script>
</body>
</html>
