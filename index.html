<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal of Advanced Ceramics 2024-2025</title>
<style>
:root {
  --bg: #fef9f3;
  --card: #ffffff;
  --primary: #d35400;
  --primary-dark: #a04000;
  --accent: #e67e22;
  --accent-light: #fdebd0;
  --accent-bg: #fff5e6;
  --text: #3e2723;
  --text-muted: #795548;
  --border: #f0d9c8;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(139,69,19,0.06), 0 4px 12px rgba(139,69,19,0.04);
  --shadow-hover: 0 4px 12px rgba(139,69,19,0.1), 0 8px 24px rgba(139,69,19,0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, #e67e22 0%, #f39c12 50%, #f1c40f 100%);
  color: #fff;
  padding: 28px 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(230,126,34,0.25);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.3px; }
.header p { font-size: 0.85rem; opacity: 0.8; font-weight: 400; }

.export-btns { display: flex; gap: 8px; }
.export-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.35);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.2s;
  backdrop-filter: blur(4px);
}
.export-btn:hover { background: rgba(255,255,255,0.35); }

/* ── Search ── */
.search-section {
  max-width: 1200px;
  margin: 24px auto 12px;
  padding: 0 24px;
}
.search-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: stretch;
}
.search-wrap {
  flex: 1;
  min-width: 220px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.95rem;
  background: var(--card);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(230,126,34,0.12);
}
.search-wrap .icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  pointer-events: none;
}

.filter-select {
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.88rem;
  background: var(--card);
  cursor: pointer;
  min-width: 130px;
  transition: border-color 0.2s;
}
.filter-select:focus {
  outline: none;
  border-color: var(--accent);
}

/* ── Stats ── */
.stats-row {
  max-width: 1200px;
  margin: 0 auto 20px;
  padding: 0 24px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.stat-chip {
  background: var(--card);
  padding: 8px 16px;
  border-radius: 24px;
  font-size: 0.82rem;
  color: var(--text-muted);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 1px 2px rgba(139,69,19,0.04);
}
.stat-chip strong { color: var(--accent); font-size: 1rem; }
.stat-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #e67e22; }

/* ── Article List ── */
.list {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 48px;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border-left: 4px solid transparent;
  transition: all 0.2s ease;
}
.card:hover {
  border-left-color: var(--accent);
  box-shadow: var(--shadow-hover);
  transform: translateY(-1px);
}
.card.open { border-left-color: var(--primary); }

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  cursor: pointer;
}
.card-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  line-height: 1.45;
}
.card-title:hover { color: var(--accent); }

.badges { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
.badge-year {
  background: var(--accent);
  color: #fff;
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-type {
  background: var(--accent-bg);
  color: var(--primary);
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 0.75rem;
  font-weight: 500;
}
.btn-expand {
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 14px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-expand:hover {
  background: var(--accent);
  color: #fff;
}

.card-authors {
  font-size: 0.84rem;
  color: #8d6e63;
  margin-top: 8px;
  line-height: 1.5;
  max-width: 700px;
}
.card-keywords {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.kw {
  background: var(--accent-bg);
  color: var(--primary);
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 0.74rem;
}

/* ── Detail Panel ── */
.detail {
  display: none;
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.card.open .detail { display: block; }

.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.d-item { font-size: 0.83rem; }
.d-item label {
  display: block;
  color: #a1887f;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 2px;
}
.d-item span { color: var(--text); font-weight: 500; }

.d-abstract {
  font-size: 0.88rem;
  color: var(--text);
  line-height: 1.75;
  margin-top: 10px;
  padding: 12px 16px;
  background: var(--accent-bg);
  border-radius: 8px;
  border-left: 3px solid var(--accent);
}

.d-links {
  margin-top: 14px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.d-links a {
  font-size: 0.83rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}
.d-links a:hover { text-decoration: underline; }

/* ── Cite ── */
.d-cite {
  margin-top: 10px;
  padding: 10px 14px;
  background: #f8f9fa;
  border-radius: 8px;
  border-left: 3px solid var(--accent);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.d-cite-text {
  flex: 1;
  font-size: 0.82rem;
  color: var(--text-muted);
  line-height: 1.6;
  word-break: break-word;
}
.d-cite-copy {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s;
}
.d-cite-copy:hover { background: var(--primary); }
.d-cite-copy.copied { background: #27ae60; }

/* ── Card DOI & Abstract ── */
.card-doi {
  font-family: 'Source Han Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 0.8rem;
  margin-top: 6px;
  word-break: break-all;
}
.card-doi a {
  color: var(--accent);
  text-decoration: none;
}
.card-doi a:hover {
  text-decoration: underline;
}
.card-abstract {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.6;
  margin-top: 8px;
  text-align: justify;
}

/* ── Loading / Empty ── */
.center-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.spinner {
  display: inline-block;
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Footer ── */
.footer {
  text-align: center;
  padding: 24px;
  color: var(--text-muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--border);
  margin-top: 24px;
}
.footer a { color: var(--accent); text-decoration: none; }

/* ── Responsive ── */
@media (max-width: 640px) {
  .header-inner { flex-direction: column; align-items: flex-start; }
  .search-row { flex-direction: column; }
  .filter-select { width: 100%; }
  .card-head { flex-direction: column; }
  .badges { flex-shrink: 1; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div>
      <h1>Journal of Advanced Ceramics 2024-2025</h1>
      <p>Article Index & Search</p>
    </div>

  </div>
</header>

<section class="search-section">
  <div class="search-row">
    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search by title, author, keyword...">
    </div>
    <select class="filter-select" id="yearFilter"><option value="">All Years</option></select>
    <select class="filter-select" id="typeFilter"><option value="">All Types</option></select>
    <select class="filter-select" id="areaFilter"><option value="">All Areas</option></select>
  </div>
</section>

<div class="stats-row" id="statsRow"></div>

<div class="list" id="articleList">
  <div class="center-msg"><div class="spinner"></div><div>Loading articles...</div></div>
</div>

<div class="footer">
  Journal of Advanced Ceramics 2024-2025 &copy; 2026 — Data from <a href="https://www.sciopen.com" target="_blank">SciOpen</a>
</div>

<script>
const DATA_URL = 'articles_md/articles.json?v=20260902';
let allArticles = [];
let filteredArticles = [];

const $search = document.getElementById('searchInput');
const $year = document.getElementById('yearFilter');
const $type = document.getElementById('typeFilter');
const $area = document.getElementById('areaFilter');
const $list = document.getElementById('articleList');
const $stats = document.getElementById('statsRow');

/* ── Load ── */
async function loadData() {
  try {
    const r = await fetch(DATA_URL);
    allArticles = await r.json();
    filteredArticles = allArticles;
    fillFilters();
    render();
  } catch (e) {
    $list.innerHTML = `<div class="center-msg">⚠️ Failed to load: ${e.message}</div>`;
  }
}

/* ── Filters ── */
function fillFilters() {
  const years = new Set(), types = new Set(), areas = new Set();
  allArticles.forEach(a => { if (a.year) years.add(a.year); if (a.type) types.add(a.type); if (a.research_area_zh) areas.add(a.research_area_zh); });
  [...years].sort((a,b)=>b-a).forEach(y => {
    const o = document.createElement('option'); o.value = y; o.textContent = y; $year.appendChild(o);
  });
  [...types].sort().forEach(t => {
    const o = document.createElement('option'); o.value = t; o.textContent = t; $type.appendChild(o);
  });
  [...areas].sort().forEach(a => {
    const o = document.createElement('option'); o.value = a; o.textContent = a; $area.appendChild(o);
  });
}

let currentQuery = '';

function applyFilters() {
  const q = $search.value.trim();
  currentQuery = q;
  const yv = $year.value, tv = $type.value, av = $area.value;
  filteredArticles = allArticles
    .map(a => {
      if (yv && a.year != yv) return null;
      if (tv && a.type !== tv) return null;
      if (av && a.research_area_zh !== av) return null;
      const score = searchScore(a, q);
      if (q && score === 0) return null;
      return { ...a, _score: score, _q: q };
    })
    .filter(Boolean)
    .sort((a, b) => b._score - a._score);
  render();
}

/* ── Highlight ── */
function highlight(text, query) {
  if (!query || !text) return esc(text || '');
  const tokens = query.trim().split(/\s+/).filter(Boolean);
  let result = esc(text);
  for (const tok of tokens) {
    const re = new RegExp('(' + tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    result = result.replace(re, '<mark style="background:#fde047;padding:0 2px;border-radius:2px">$1</mark>');
  }
  return result;
}

/* ── Fuzzy Search ── */
function fuzzyMatch(text, query) {
  if (!query) return { match: true, score: 0 };
  const t = (text || '').toLowerCase();
  const q = query.toLowerCase().trim();
  if (!q) return { match: true, score: 0 };
  if (t.includes(q)) return { match: true, score: 10 };
  const tokens = q.split(/\s+/);
  let allMatch = true;
  for (const tok of tokens) {
    if (!t.includes(tok)) { allMatch = false; break; }
  }
  if (allMatch) return { match: true, score: 5 };
  let qi = 0;
  for (let i = 0; i < t.length && qi < q.length; i++) {
    if (t[i] === q[qi]) qi++;
  }
  if (qi === q.length) return { match: true, score: 2 };
  return { match: false, score: 0 };
}

function searchScore(a, q) {
  if (!q) return 1;
  const tokens = q.toLowerCase().trim().split(/\s+/);
  let total = 0;
  let anyMatch = false;
  for (const tok of tokens) {
    const fields = [
      { v: a.title || '', w: 10 },
      { v: (a.authors||[]).map(x=>x.name).join(' ') || '', w: 5 },
      { v: (a.keywords||[]).join(' ') || '', w: 4 },
      { v: a.research_area || '', w: 3 },
      { v: a.research_area_zh || '', w: 3 },
      { v: a.abstract || '', w: 1 },
    ];
    let best = 0;
    for (const f of fields) {
      const r = fuzzyMatch(f.v, tok);
      if (r.match) {
        anyMatch = true;
        best = Math.max(best, r.score * f.w);
      }
    }
    total += best;
  }
  return anyMatch ? total : 0;
}

/* ── Render ── */
function render() {
  const views = filteredArticles.reduce((s,a) => s + (parseInt(a.views)||0), 0);
  const downloads = filteredArticles.reduce((s,a) => s + (parseInt(a.downloads)||0), 0);
  $stats.innerHTML = `<div style="display:none"></div>`;

  if (!filteredArticles.length) {
    $list.innerHTML = `<div class="center-msg"><div style="font-size:2.5rem;margin-bottom:8px">🔍</div><div>No articles found</div></div>`;
    return;
  }

  $list.innerHTML = filteredArticles.map((a,i) => {
    const corrSet = parseCorresponding(a.corresponding_authors || '');
    const formatAuthor = au => {
      const name = (au.name || '').trim();
      const formatted = corrSet.has(name) ? `<strong>${esc(name)}</strong>` : esc(name);
      return `<span style="display:inline-block;white-space:nowrap">${formatted}</span>`;
    };
    const formattedAuthors = (a.authors||[]).map(formatAuthor);
    const shortNames = formattedAuthors.join(', ');
    const kws = (a.keywords||[]).slice(0,5).map(k => `<span class="kw">${highlight(k.replace(/<[^>]+>/g, ''), currentQuery)}</span>`).join('');
     const volIssue = (a.volume || a.issue) ? `Vol.${a.volume||'?'} Issue ${a.issue||'?'}` : '';

    return `
    <div class="card" data-idx="${i}">
      <div class="card-head" onclick="toggle(this.parentElement)">
        <div class="card-title">${highlight(a.title.replace(/<[^>]+>/g, ''), currentQuery)}</div>
        <div class="badges">
          ${a.year ? `<span class="badge-year">${a.year}</span>` : ''}
          ${a.type ? `<span class="badge-type">${esc(a.type)}</span>` : ''}
           ${volIssue ? `<span class="badge-type">${esc(volIssue)}</span>` : ''}
          <button class="btn-expand" onclick="event.stopPropagation();toggle(this.closest('.card'))">展开 ▾</button>
        </div>
      </div>
      <div class="card-authors">${shortNames}</div>
      ${kws ? `<div class="card-keywords">${kws}</div>` : ''}
       ${a.doi ? `<div class="card-doi"><a href="https://doi.org/${a.doi}" target="_blank" onclick="event.stopPropagation()">https://doi.org/${esc(a.doi)}</a></div>` : ''}
      <div class="detail">
        <div class="detail-grid">
          ${a.doi ? `<div class="d-item"><label>DOI</label><span>${esc(a.doi)}</span></div>` : ''}
          ${a.volume ? `<div class="d-item"><label>Volume(Issue)</label><span>${a.volume}(${a.issue})</span></div>` : ''}
          ${a.research_area ? `<div class="d-item"><label>Research Area</label><span>${esc(a.research_area)}</span></div>` : ''}
        </div>
        ${a.abstract ? `<div class="d-abstract"><strong>Abstract:</strong> ${highlight(a.abstract.replace(/<[^>]+>/g, ''), currentQuery)}</div>` : ''}
        ${a.doi ? `
        <div class="d-cite">
          <div class="d-cite-text" id="cite-${i}"><strong>Cite this article:</strong> <span class="cite-content"></span></div>
          <button class="d-cite-copy" onclick="event.stopPropagation();copyCite(${i})">复制</button>
        </div>` : ''}
        <div class="d-links">
          ${a.url ? `<a href="${a.url}" target="_blank" onclick="event.stopPropagation()">View on SciOpen →</a>` : ''}
          ${a.pdf ? `<a href="${a.pdf}" target="_blank" onclick="event.stopPropagation()">Download PDF →</a>` : ''}
          ${a.doi ? `<a href="javascript:void(0)" onclick="event.stopPropagation();downloadRIS(${i})" style="color:#27ae60">Download RIS →</a>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── Toggle ── */
function toggle(card) {
  card.classList.toggle('open');
  const btn = card.querySelector('.btn-expand');
  if (btn) {
    btn.textContent = card.classList.contains('open') ? '收起 ▴' : '展开 ▾';
  }
  if (card.classList.contains('open')) {
    const idx = parseInt(card.dataset.idx);
    const a = filteredArticles[idx];
    const citeEl = card.querySelector('.cite-content');
    if (citeEl && a) citeEl.textContent = getCiteText(a);
  }
}

/* ── Cite Text ── */
function getCiteText(a) {
  const aus = (a.authors||[]).map(au => {
    const name = (au.name || '').trim();
    const parts = name.split(/\s+/);
    if (parts.length >= 2) {
      const last = parts[parts.length-1];
      const firstInit = parts[0]?.[0]?.toUpperCase() || '';
      return `${last} ${firstInit}`;
    }
    return name;
  });
  let authorStr;
  if (aus.length > 3) {
    authorStr = aus.slice(0,3).join(', ') + ', et al';
  } else {
    authorStr = aus.join(', ');
  }
  const year = a.year || '';
  const title = (a.title || '').replace(/<[^>]+>/g, '');
  const volIssue = (a.volume || a.issue) ? `${a.volume||''}(${a.issue||''})` : '';
  const artNum = a.doi ? a.doi.match(/JAC\.\d+\.(\d+)/)?.[1] || '' : '';
  const doiUrl = `https://doi.org/${a.doi || ''}`;
  return `${authorStr}. ${title}. Journal of Advanced Ceramics, ${year}, ${volIssue}: ${artNum}. ${doiUrl}`;
}

/* ── Cite HTML (with corresponding author bolded) ── */
function getCiteHTML(a) {
  const corrAuthors = parseCorresponding(a.corresponding_authors || '');
  const aus = (a.authors||[]).map(au => {
    const name = (au.name || '').trim();
    const parts = name.split(/\s+/);
    let formatted;
    if (parts.length >= 2) {
      const last = parts[parts.length-1];
      const firstInit = parts[0]?.[0]?.toUpperCase() || '';
      formatted = `${last} ${firstInit}`;
    } else {
      formatted = name;
    }
    if (corrAuthors.has(name)) {
      formatted = `<strong>${formatted}</strong>`;
    }
    return formatted;
  });
  let authorStr;
  if (aus.length > 3) {
    authorStr = aus.slice(0,3).join(', ') + ', et al';
  } else {
    authorStr = aus.join(', ');
  }
  const year = a.year || '';
  const title = (a.title || '').replace(/<[^>]+>/g, '');
  const volIssue = (a.volume || a.issue) ? `${a.volume||''}(${a.issue||''})` : '';
  const artNum = a.doi ? a.doi.match(/JAC\.\d+\.(\d+)/)?.[1] || '' : '';
  const doiUrl = `https://doi.org/${a.doi || ''}`;
  return `${authorStr}. ${title}. Journal of Advanced Ceramics, ${year}, ${volIssue}: ${artNum}. ${doiUrl}`;
}

function parseCorresponding(raw) {
  const set = new Set();
  if (!raw) return set;
  raw.split(/[;;\n]+/).forEach(s => {
    const name = s.trim();
    if (name) set.add(name);
  });
  return set;
}

/* ── Copy Cite ── */
function copyCite(idx) {
  const a = filteredArticles[idx];
  if (!a) return;
  const text = getCiteText(a);
  const btn = event.target;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showCopied(btn);
    }).catch(() => {
      fallbackCopy(text, btn);
    });
  } else {
    fallbackCopy(text, btn);
  }
}

function fallbackCopy(text, btn) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showCopied(btn);
  } catch(e) {}
  document.body.removeChild(ta);
}

function showCopied(btn) {
  btn.textContent = '已复制 ✓';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = '复制';
    btn.classList.remove('copied');
  }, 1500);
}

/* ── Escape ── */
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Export CSV ── */
function exportCSV() {
  const headers = ['Title','Year','Volume','Issue','Type','DOI','URL','PDF','Authors','Keywords','Research Area','Received','Accepted','Published','Views','Downloads','Crossref Cit.','WoS Cit.','Scopus Cit.','Abstract'];
  const rows = filteredArticles.map(a => [
    a.title, a.year||'', a.volume||'', a.issue||'', a.type||'', a.doi||'', a.url||'', a.pdf||'',
    (a.authors||[]).map(x=>x.name).join('; '),
    (a.keywords||[]).join('; '),
    a.research_area||'', a.received||'', a.accepted||'', a.published||'',
    a.views||'', a.downloads||'', a.citations_crossref||'', a.citations_wos||'', a.citations_scopus||'',
    (a.abstract||'').replace(/\n/g,' ')
  ]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  download(csv, 'JAC_articles.csv', 'text/csv;charset=utf-8;');
}

/* ── Export JSON ── */
function exportJSON() {
  const data = filteredArticles.map(a => ({
    title: a.title, year: a.year, volume: a.volume, issue: a.issue, type: a.type,
    doi: a.doi, url: a.url, pdf: a.pdf,
    authors: (a.authors||[]).map(x => x.name),
    keywords: a.keywords, research_area: a.research_area,
    received: a.received, accepted: a.accepted, published: a.published,
    views: a.views, downloads: a.downloads,
    citations: { crossref: a.citations_crossref, wos: a.citations_wos, scopus: a.citations_scopus },
    abstract: a.abstract
  }));
  download(JSON.stringify(data, null, 2), 'JAC_articles.json', 'application/json');
}

/* ── Download RIS ── */
function downloadRIS(idx) {
  const a = filteredArticles[idx];
  if (!a) return;
  const ris = [];
  ris.push('TY  - JOUR');
  (a.authors||[]).forEach(au => {
    const name = au.name || '';
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) {
      ris.push('AU  - ' + parts[parts.length-1] + ', ' + parts.slice(0,-1).join(' '));
    } else {
      ris.push('AU  - ' + name);
    }
  });
  if (a.year) ris.push('PY  - ' + a.year);
  ris.push('TI  - ' + (a.title||'').replace(/<[^>]+>/g, ''));
  ris.push('JO  - Journal of Advanced Ceramics');
  ris.push('SN  - 2226-4108');
  if (a.doi) {
    const m = a.doi.match(/JAC\.\d+\.(\d+)/);
    if (m) ris.push('SP  - ' + m[1]);
  }
  if (a.volume) ris.push('VL  - ' + a.volume);
  if (a.issue) ris.push('IS  - ' + a.issue);
  if (a.abstract) ris.push('AB  - ' + a.abstract.replace(/<[^>]+>/g, '').replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16))).replace(/\\\//g,'/').replace(/\\\\/g,'\\').replace(/\s+/g,' ').trim());
  if (a.doi) ris.push('UR  - https://doi.org/' + a.doi);
  if (a.doi) ris.push('DO  - ' + a.doi);
  const fn = (a.doi||'JAC').replace(/[/\\]/g,'_') + '.ris';
  download(ris.join('\r\n') + '\r\n', fn, 'application/x-research-info-systems;charset=utf-8;');
}

/* ── Download helper ── */
function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ── Events ── */
$search.addEventListener('input', debounce(applyFilters, 300));
$year.addEventListener('change', applyFilters);
$type.addEventListener('change', applyFilters);
$area.addEventListener('change', applyFilters);

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* ── Init ── */
loadData();
</script>
